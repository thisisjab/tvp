[project]
name = "tvp"
version = "0.1.0"
description = "tiny video party service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "orjson>=3.11.8",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-magic>=0.4.27",
    "redis[hiredis]>=7.4.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "taskiq>=0.12.2",
    "taskiq-aio-pika>=0.6.0",
    "taskiq-redis>=1.2.2",
    "trio>=0.33.0",
    "uvicorn>=0.44.0",
]

[[tool.uv.index]]
url = "https://mirror2.chabokan.net/pypi/simple/"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = [
    "test_*.py",
]
pythonpath = "."
testpaths = "tvp/tests"
